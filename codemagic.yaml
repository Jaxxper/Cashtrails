workflows:
  android-build:
    name: Android APK Build
    environment:
      sdk: "33"
      java: "17"
    scripts:
      - name: Make gradlew executable
        script: chmod +x ./gradlew
      - name: Clean build
        script: ./gradlew clean
      - name: Assemble debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - build/app/outputs/**/*.apk
    cache:
      cache_paths:
        - ~/.gradle
