workflows:
  android-build:
    name: Build Android App
    max_build_duration: 60
    environment:
      android: true
      java: 17
    scripts:
      - name: Set Gradlew Permission
        script: chmod +x ./gradlew
      - name: Build APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
