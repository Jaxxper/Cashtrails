workflows:
  android-build:
    name: Build Android App
    max_build_duration: 60
    environment:
      vars:
        JAVA_HOME: /opt/android-studio/jbr
    scripts:
      - name: Make gradlew executable
        script: chmod +x ./gradlew
      - name: Build APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
