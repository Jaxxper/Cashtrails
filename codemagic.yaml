workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    environment:
      vars:
        JAVA_HOME: /opt/java/openjdk17
      android_signing:
        - YOUR_SIGNING
    scripts:
      - chmod +x ./gradlew
      - ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
